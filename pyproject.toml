[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spiderintel"
version = "2.1.0"
description = "Authorized OSINT and vulnerability assessment CLI for Kali Linux"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "SpiderIntel Team" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
]
dependencies = [
  "requests>=2.32.0,<3",
  "beautifulsoup4>=4.12.3,<5",
  "dnspython>=2.6.1,<3",
  "python-whois>=0.9.4,<1",
  "tldextract>=5.1.2,<6",
  "networkx>=3.2.1,<4",
  "matplotlib>=3.8.4,<4",
  "tqdm>=4.66.4,<5",
  "termcolor>=2.4.0,<3",
  "psutil>=5.9.8,<7",
  "jinja2>=3.1.4,<4",
  "markdown>=3.6,<4",
  "pyyaml>=6.0.1,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.5,<1",
]

[project.scripts]
spiderintel = "spiderintel:main"

[tool.setuptools]
py-modules = ["spiderintel", "report_generator"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
