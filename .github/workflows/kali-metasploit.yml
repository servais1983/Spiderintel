name: Kali Metasploit integration

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metasploit-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
      - name: Build Kali Metasploit image
        run: docker build --target kali-metasploit -f docker/kali-integration.Dockerfile -t spiderintel-kali-metasploit .
      - name: Run local-only Metasploit smoke test
        run: docker run --rm --cap-add=NET_RAW spiderintel-kali-metasploit
